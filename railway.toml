[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend && mkdir -p backend/public && cp -r frontend/dist/. backend/public/"

[deploy]
startCommand = "cd backend && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "cs-steel-wms"
