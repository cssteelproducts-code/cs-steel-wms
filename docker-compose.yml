version: '3.9'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

# หมายเหตุ: MSSQL ทำงานบน Windows Server อยู่แล้ว (ไม่ต้อง containerize)
# server เชื่อมตรงผ่าน MSSQL_SERVER ใน .env
